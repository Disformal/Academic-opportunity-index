apiVersion: 1
policies:
  - orgId: 1
    receiver: aoi-email
    group_by:
      - alertname
      - source
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
    routes:
      # Critical alerts: email + webhook, no wait
      - receiver: aoi-webhook
        matchers:
          - severity = critical
        group_wait: 0s
        repeat_interval: 10m
        continue: true  # also send to parent (email)
      # Warning alerts: email only, longer repeat interval
      - receiver: aoi-email
        matchers:
          - severity = warning
        repeat_interval: 1h
