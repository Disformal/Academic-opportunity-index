[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aoi"
version = "0.1.0"
requires-python = ">=3.13"
license = "EUPL-1.2"
dependencies = [
    "sqlalchemy[postgresql]",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "fastapi",
    "jinja2",
    "uvicorn[standard]",
    "httpx[http2]",
    "structlog",
    "selectolax",
    "rapidfuzz",
    "lingua-language-detector",
    "zstandard",
    "boto3",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.0",
    "extruct>=0.18.0",
    "warcio>=1.8.1",
]

[project.scripts]
aoi = "aoi.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "boto3-stubs[s3]",
    "hypothesis>=6.168.1",
    "types-python-dateutil>=2.9.0.20260807",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: requires real database and/or external services",
    "live: requires real external network access; run manually only",
]
