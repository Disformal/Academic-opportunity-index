# Discipline taxonomy for AOI (M1 slice 6), loaded by `aoi taxonomy sync` into
# core.discipline and core.discipline_parent.
#
# Codes are scheme-prefixed: "fos:<n>" for the OECD Fields of Science and Technology
# (FOS 2007, Frascati Manual) and "arxiv:<category>" for arXiv categories, which INSPIRE
# uses for job postings.
#
# A discipline may have SEVERAL parents. Overlaps between fields are intended
# (e.g. medical physics is physics and clinical medicine). Every arXiv physics
# category reaches fos:1.3 (Physical sciences) through at least one parent.
#
# Lines marked "# provisional" are cross-field parents accepted as provisional
# (2026-10-17). Subsections and overlaps will be
# refined once the full index exists (plan §8, D-11).
#
# Version: 1

