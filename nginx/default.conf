# ─── AOI nginx reverse proxy ──────────────────────────────────────────────────
# HTTP Basic Auth + reverse proxy to Grafana. The old web app was removed in M3 (ADR 0032);
# the public site returns in M7. TLS is added by certbot on the VPS — not configured here.

server {
    listen 80;
    server_name _;
    server_tokens off;

    # HTTP Basic Auth — all routes require credentials.
    # Generate the htpasswd file:
    #   sudo apt-get install apache2-utils
    #   htpasswd -c /etc/nginx/htpasswd aoi_admin
    #   htpasswd    /etc/nginx/htpasswd another_user
    auth_basic           "AOI — Authorized Users Only";
    auth_basic_user_file /etc/nginx/htpasswd;

    # Grafana — reverse proxy to the Grafana container
    location /grafana/ {
        proxy_pass         http://aoi-grafana:3000/grafana/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }
}
